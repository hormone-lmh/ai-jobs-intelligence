# AI 岗位技能词典 v1
# 用途：规则匹配的基础词表。仅用于初始分类，不代表市场结论。
# 匹配实现约定（重要）：
#   拉丁缩写不要用 \b 作边界。中文与字母同属 \w，"使用RAG技术" 里 RAG 两侧都不是边界，
#   用 \b 会全部漏匹配。应采用断言： (?<![A-Za-z0-9])RAG(?![A-Za-z0-9])
# 修改本文件后，需重跑 skill 提取，历史快照不受影响（见 docs/03-指标口径.md）。

